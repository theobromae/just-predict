name: build-macos
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: JustPredict-macos-arm64
          path: dist/JustPredict-macos-arm64.zip
          retention-days: 30
      - name: Lampirkan ke GitHub Release (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JustPredict-macos-arm64.zip
    permissions:
      contents: write
